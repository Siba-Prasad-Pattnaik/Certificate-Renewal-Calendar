name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'Deployment target'
        required: true
        default: 'vercel'
        type: choice
        options:
          - vercel
          - github-pages

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default environment variables for all jobs
env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  NEXT_PUBLIC_VERCEL_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}

jobs:
  vercel-preview:
    name: Vercel Preview Deploy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      
      # Check if Vercel secrets are available
      - name: Check Vercel secrets
        id: check-secrets
        run: |
          if [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ] || [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "Missing Vercel secrets - skipping preview deploy"
            echo "skipped=true" >> $GITHUB_OUTPUT
          else
            echo "skipped=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Install Vercel CLI
        if: steps.check-secrets.outputs.skipped == 'false'
        run: npm install --global vercel@latest
      
      - name: Pull Vercel environment information
        if: steps.check-secrets.outputs.skipped == 'false'
        run: vercel pull --yes --token=${{ secrets.VERCEL_TOKEN }}
      
      - name: Build Project Artifacts
        if: steps.check-secrets.outputs.skipped == 'false'
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
      
      - name: Deploy to Vercel
        if: steps.check-secrets.outputs.skipped == 'false'
        id: deploy
        run: |
          DEPLOYMENT_URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "deployment_url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT
          echo "Deployed to: $DEPLOYMENT_URL"
      
      - name: Comment on PR with deployment URL
        if: steps.check-secrets.outputs.skipped == 'false' && steps.deploy.outputs.deployment_url
        uses: actions/github-script@v7
        with:
          script: |
            const { deploy } = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            
            const comment = `🚀 **Preview Deployment**
            
Preview URL: ${process.env.deployment_url}
            
This deployment will be automatically removed when the PR is closed.
            
**Note**: View the Preview URL to validate the changes before merging.`;
            
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment,
            });
      
      - name: Run smoke test against preview
        if: steps.check-secrets.outputs.skipped == 'false' && steps.deploy.outputs.deployment_url
        run: |
          npm run smoke-test -- --url=${{ steps.deploy.outputs.deployment_url }}

  vercel-production:
    name: Vercel Production Deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [ci, lighthouse]
    timeout-minutes: 15
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      
      - name: Check Vercel secrets
        id: check-secrets
        run: |
          if [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ] || [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "Missing Vercel secrets - skipping production deploy"
            echo "skipped=true" >> $GITHUB_OUTPUT
          else
            echo "skipped=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Install Vercel CLI
        if: steps.check-secrets.outputs.skipped == 'false'
        run: npm install --global vercel@latest
      
      - name: Pull Vercel environment information
        if: steps.check-secrets.outputs.skipped == 'false'
        run: vercel pull --yes --token=${{ secrets.VERCEL_TOKEN }} --environment=production
      
      - name: Build Project Artifacts
        if: steps.check-secrets.outputs.skipped == 'false'
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      
      - name: Deploy to Production
        if: steps.check-secrets.outputs.skipped == 'false'
        id: deploy
        run: |
          DEPLOYMENT_URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "deployment_url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT
          echo "::notice title=Production Deployment::Deployed to: $DEPLOYMENT_URL"
      
      - name: Invalidate cache and revalidate ISR
        if: steps.check-secrets.outputs.skipped == 'false'
        run: |
          curl -X POST "https://api.vercel.com/v1/integrations/deploy/$VERCEL_PROJECT_ID" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}"
      
      - name: Run smoke test against production
        if: steps.check-secrets.outputs.skipped == 'false' && steps.deploy.outputs.deployment_url
        run: |
          npm run smoke-test -- --url=${{ steps.deploy.outputs.deployment_url }}

  github-pages-fallback:
    name: GitHub Pages Fallback
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_target == 'github-pages'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Prepare static export
        run: npm run prepare-static-export
        env:
          DEPLOY_TARGET: github-pages
      
      - name: Build static site
        run: npm run build
        env:
          DEPLOY_TARGET: github-pages
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4